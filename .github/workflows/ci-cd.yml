name: TaskFlow CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ─── JOB 1: TEST ──────────────────────────────────────────
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Check backend structure
        run: |
          echo "✅ Backend files:"
          ls backend/src/

  # ─── JOB 2: BUILD & PUSH DOCKER IMAGES ───────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taskflow-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/taskflow-backend:${{ github.sha }}

      - name: Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend:${{ github.sha }}

      - name: Summary
        run: |
          echo "🚀 Pipeline Complete!"
          echo "Backend  → docker pull ${{ secrets.DOCKER_USERNAME }}/taskflow-backend:latest"
          echo "Frontend → docker pull ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend:latest"
